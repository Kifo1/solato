<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian studio surface -->
    <radialGradient id="bgGrad" cx="50%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#1E222B" />
      <stop offset="55%" stop-color="#12141A" />
      <stop offset="100%" stop-color="#090A0D" />
    </radialGradient>

    <!-- Subtle top-down specular rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Soft ambient solar glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Signature Solato Solar Amber arc gradients -->
    <linearGradient id="arcTopRight" x1="256" y1="100" x2="412" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="48%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="arcBottomLeft" x1="256" y1="412" x2="100" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="centerDot" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <filter id="arcGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="21.5" y="21.5" width="469" height="469" rx="110.5" ry="110.5" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Subtle warm center ambient light -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  <!-- Subtle inner horological dial ring -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2" />

  <!-- Main Timer Track Circle (r = 152, circumference = 955.04) -->
  <circle
    cx="256"
    cy="256"
    r="152"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="18"
  />

  <!-- Soft outer glow pass for the two opposing signature timer arcs -->
  <g filter="url(#arcGlow)" opacity="0.45">
    <path
      d="M 264 104.2 A 152 152 0 0 1 407.8 248"
      fill="none"
      stroke="#F59E0B"
      stroke-width="26"
      stroke-linecap="round"
    />
    <path
      d="M 248 407.8 A 152 152 0 0 1 104.2 264"
      fill="none"
      stroke="#F59E0B"
      stroke-width="26"
      stroke-linecap="round"
    />
  </g>

  <!-- Crisp Signature Opposing Quarter-Arcs (mirrors TimerDisplay 71-70-71-70 ring) -->
  <path
    d="M 264 104.2 A 152 152 0 0 1 407.8 248"
    fill="none"
    stroke="url(#arcTopRight)"
    stroke-width="26"
    stroke-linecap="round"
  />
  <path
    d="M 248 407.8 A 152 152 0 0 1 104.2 264"
    fill="none"
    stroke="url(#arcBottomLeft)"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Minimal center solar chronometer pivot -->
  <circle cx="256" cy="256" r="26" fill="#F59E0B" opacity="0.16" />
  <circle cx="256" cy="256" r="14" fill="url(#centerDot)" />
</svg>
